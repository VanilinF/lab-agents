<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Подготовка к экзамену{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong><a href="{% url 'home' %}">Exam Prep</a></strong></li>
      </ul>
      <ul>
        {% if user.is_authenticated %}
          <li><a href="{% url 'quiz:progress' %}">Мой прогресс</a></li>
          <li>{{ user.username }}</li>
          <li>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="outline secondary">Выйти</button>
            </form>
          </li>
        {% else %}
          <li><a href="{% url 'login' %}">Вход</a></li>
          <li><a href="{% url 'accounts:register' %}">Регистрация</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
